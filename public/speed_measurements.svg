<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc">
  <title id="title">Compressor image encoding benchmark</title>
  <desc id="desc">Apple-inspired dark comparison chart showing Compressor ahead of other tools for JPEG and WebP encoding.</desc>
  <defs>
    <linearGradient id="primary" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d7fff8"/>
      <stop offset="0.55" stop-color="#8bd8e7"/>
      <stop offset="1" stop-color="#5d7e9d"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6e6e8"/>
      <stop offset="1" stop-color="#707070"/>
    </linearGradient>
    <style>
      .title { fill: #f5f5f7; font: 600 64px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -2.8px; }
      .eyebrow { fill: #a1a1a6; font: 400 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
      .section { fill: #f5f5f7; font: 600 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.1px; }
      .format { fill: #a1a1a6; font: 400 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
      .label { fill: #f5f5f7; font: 500 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; letter-spacing: -.4px; }
      .value { fill: #a1a1a6; font: 600 30px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1px; }
      .primary-value { fill: #9ee7ff; }
      .rule { stroke: #3b3b3d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="1370" fill="#1d1d1f"/>
  <text class="title" x="80" y="116">Faster image encoding performance.</text>
  <text class="eyebrow" x="80" y="158">Tested on MacBook Air M5 · 130 × 26MP mirrorless camera photos</text>
  <line class="rule" x1="80" y1="204" x2="1120" y2="204"/>

  <text class="format" x="80" y="260">JPEG encoding</text>
  <text class="section" x="80" y="318">4.4× faster than the next best compressor.</text>

  <rect x="80" y="366" width="780" height="10" rx="5" fill="url(#primary)"/>
  <text class="label" x="80" y="410">Compressor</text>
  <text class="value primary-value" x="900" y="409">23.6 img/s</text>

  <rect x="80" y="478" width="168" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="522">ImageCompressr.com</text>
  <text class="value" x="900" y="521">5.4 img/s</text>

  <rect x="80" y="590" width="25" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="634">ImageCompressor.com</text>
  <text class="value" x="900" y="633">0.8 img/s</text>

  <rect x="80" y="702" width="10" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="746">W3Schools</text>
  <text class="value" x="900" y="745">0.3 img/s</text>

  <line class="rule" x1="80" y1="820" x2="1120" y2="820"/>
  <text class="format" x="80" y="876">WebP encoding</text>
  <text class="section" x="80" y="934">2.2× faster than the next fastest compressor.</text>

  <rect x="80" y="982" width="780" height="10" rx="5" fill="url(#primary)"/>
  <text class="label" x="80" y="1026">Compressor</text>
  <text class="value primary-value" x="900" y="1025">9.3 img/s</text>

  <rect x="80" y="1070" width="361" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="1114">Picflow</text>
  <text class="value" x="900" y="1113">4.3 img/s</text>

  <rect x="80" y="1158" width="101" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="1202">ToWebP.io</text>
  <text class="value" x="900" y="1201">1.2 img/s</text>

  <rect x="80" y="1246" width="34" height="10" rx="5" fill="url(#secondary)"/>
  <text class="label" x="80" y="1290">ImageConverter.com</text>
  <text class="value" x="900" y="1289">0.4 img/s</text>
</svg>
