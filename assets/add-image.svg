<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Add image</title>
  <desc id="desc">A photo frame with mountains and sun, and a plus badge in the top-right corner.</desc>
  <defs>
    <linearGradient id="strokeGrad" x1="88" y1="112" x2="424" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fa48a" />
      <stop offset="1" stop-color="#34255c" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="330" y1="66" x2="446" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fa48a" />
      <stop offset="1" stop-color="#2b3a72" />
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="90" y="130" width="332" height="256" rx="24" />
    </clipPath>
  </defs>

  <!-- photo frame -->
  <rect x="72" y="112" width="368" height="288" rx="40" fill="none" stroke="url(#strokeGrad)" stroke-width="30" />

  <!-- sun + mountains -->
  <g clip-path="url(#frameClip)">
    <circle cx="176" cy="204" r="28" fill="#ffcf5c" />
    <path d="M88 372l104-116 68 68 76-84 108 132" fill="none" stroke="url(#strokeGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- plus badge -->
  <circle cx="392" cy="124" r="58" fill="url(#badgeGrad)" stroke="#f6fffc" stroke-width="10" />
  <g stroke="#f6fffc" stroke-width="20" stroke-linecap="round">
    <path d="M392 100v48" />
    <path d="M368 124h48" />
  </g>
</svg>
