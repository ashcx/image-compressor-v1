<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Settings</title>
  <desc id="desc">A cogwheel with eight rounded teeth and a transparent centre hole.</desc>
  <defs>
    <linearGradient id="gearGrad" x1="120" y1="80" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fa48a" />
      <stop offset="0.55" stop-color="#1b6a8f" />
      <stop offset="1" stop-color="#34255c" />
    </linearGradient>
  </defs>

  <!-- ring with transparent centre hole -->
  <path
    d="M256 106a150 150 0 1 0 0.01 0Z M256 186a70 70 0 1 1 -0.01 0Z"
    fill="url(#gearGrad)"
    fill-rule="evenodd"
  />

  <!-- eight rounded teeth -->
  <g fill="url(#gearGrad)">
    <rect x="222" y="56" width="68" height="88" rx="24" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(45 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(90 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(135 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(180 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(225 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(270 256 256)" />
    <rect x="222" y="56" width="68" height="88" rx="24" transform="rotate(315 256 256)" />
  </g>

  <!-- subtle highlights -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" />
</svg>
