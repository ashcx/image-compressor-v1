<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Add image</title>
  <desc id="desc">A bold photo frame with filled mountains and sun, and a solid plus badge in the top-right corner.</desc>
  <defs>
    <linearGradient id="strokeGrad" x1="88" y1="112" x2="424" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fa48a" />
      <stop offset="1" stop-color="#34255c" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="330" y1="66" x2="446" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1fa48a" />
      <stop offset="1" stop-color="#2b3a72" />
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="98" y="144" width="316" height="228" rx="20" />
    </clipPath>
  </defs>

  <!-- photo frame -->
  <rect x="68" y="114" width="376" height="288" rx="52" fill="none" stroke="url(#strokeGrad)" stroke-width="60" />

  <!-- sun + filled mountains -->
  <g clip-path="url(#frameClip)">
    <circle cx="196" cy="216" r="40" fill="#ffcf5c" />
    <path d="M98 372l102-118 66 66 74-84 74 136z" fill="url(#strokeGrad)" />
  </g>

  <!-- plus badge -->
  <circle cx="396" cy="122" r="66" fill="url(#badgeGrad)" stroke="#f6fffc" stroke-width="14" />
  <g stroke="#f6fffc" stroke-width="28" stroke-linecap="round">
    <path d="M396 94v56" />
    <path d="M368 122h56" />
  </g>
</svg>
