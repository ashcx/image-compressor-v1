<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Image Compressor</title>
  <desc id="desc">A deep teal-to-indigo glossy squircle with two arrows compressing a small photo card.</desc>
  <defs>
    <linearGradient id="surface" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fa48a" />
      <stop offset="0.52" stop-color="#175e7d" />
      <stop offset="1" stop-color="#34255c" />
    </linearGradient>
    <linearGradient id="sheen" x1="256" y1="32" x2="256" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="card" x1="256" y1="196" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4fdfb" />
      <stop offset="1" stop-color="#bfe9e0" />
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="32" y="32" width="448" height="448" rx="112" />
    </clipPath>
    <clipPath id="cardClip">
      <rect x="162" y="202" width="188" height="112" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <rect x="32" y="32" width="448" height="448" fill="url(#surface)" />
    <rect x="32" y="32" width="448" height="448" fill="url(#sheen)" />
    <rect x="32.75" y="32.75" width="446.5" height="446.5" rx="111.25" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5" />

    <!-- inward arrows -->
    <g stroke="#eafff7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M256 96v52" />
      <path d="M230 134l26 28 26-28" />
      <path d="M256 416v-52" />
      <path d="M230 378l26-28 26 28" />
    </g>

    <!-- photo card being compressed -->
    <g>
      <rect x="156" y="196" width="200" height="124" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" />
      <g clip-path="url(#cardClip)">
        <circle cx="206" cy="234" r="17" fill="#ffcf5c" />
        <path d="M162 316l52-58 34 34 40-44 70 68" fill="none" stroke="#2a8f80" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
